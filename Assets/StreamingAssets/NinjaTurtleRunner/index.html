<script>
  window.addEventListener('error', function (e) {
    if (window.Unity) window.Unity.call('JS ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (window.Unity) window.Unity.call('JS UNHANDLED REJECTION: ' + e.reason);
  });
  // rAF shim: WKWebView inside the Unity Editor treats this view as occluded and fully
  // suspends requestAnimationFrame (confirmed: raf=0 forever while event-driven JS runs).
  // Queue callbacks instead; they are flushed either by native rAF (real browser -
  // unchanged behavior) or by Unity calling window.__pumpFrames() every Unity frame.
  (function () {
    var nativeRAF = window.requestAnimationFrame.bind(window);
    window.__rafQueue = [];
    window.requestAnimationFrame = function (cb) { window.__rafQueue.push(cb); return window.__rafQueue.length; };
    window.cancelAnimationFrame = function () {};
    window.__pumpFrames = function () {
      var q = window.__rafQueue;
      if (!q.length) return;
      window.__rafQueue = [];
      var t = performance.now();
      for (var i = 0; i < q.length; i++) {
        try { q[i](t); }
        catch (e) { if (window.Unity) window.Unity.call('RAF CB ERROR: ' + e.message); }
      }
    };
    (function nativeLoop() { nativeRAF(function () { window.__pumpFrames(); nativeLoop(); }); })();
  })();
  // WKWebView's occlusion of this overlay also drives document.hidden/visibilityState true,
  // same root cause as the rAF suspension above. Game code that branches on document.hidden
  // (this game's own tick() falls back to a 100ms setTimeout, and pauses on visibilitychange)
  // takes the slow path forever as a result - that's what shows up as "laggy and slow" rather
  // than fully frozen. Force it to always read as visible. Gated on window.Unity so a real
  // browser tab (no Unity bridge) keeps normal tab-switching/pause behavior unchanged.
  if (window.Unity) {
    Object.defineProperty(document, 'hidden', { get: function () { return false; }, configurable: true });
    Object.defineProperty(document, 'visibilityState', { get: function () { return 'visible'; }, configurable: true });
  }
  // Diagnostics: count rAF frames and timer ticks so the Unity side can tell whether
  // time-driven JS runs at all in this WebView (event-driven JS provably does).
  window.__diag = { t0: Date.now(), raf: 0, iv: 0, to: 0, moduleRan: 0 };
  (function () {
    function rafLoop() { window.__diag.raf++; requestAnimationFrame(rafLoop); }
    requestAnimationFrame(rafLoop);
    setInterval(function () { window.__diag.iv++; }, 250);
    setTimeout(function () { window.__diag.to = 1; }, 500);
  })();
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   CONSTANTS
============================================================ */
const LANE_X = [-2.2, 0, 2.2];
const PLAYER_Z = 0;
const SPAWN_Z = -130;
const KILL_Z = 14;
const GRAVITY = -26;
const JUMP_V = 10.2;
const ROLL_TIME = 0.6;
const BASE_SPEED = 13;
const MAX_SPEED = 32;
const SPEED_RAMP = 0.18;
const LANE_LERP = 14;

const CHARACTERS = [
  { name:'LEONARDO',     short:'LEO',    color:0x2b6fd4, css:'#2b6fd4', trait:'Katana • Leader' },
  { name:'RAPHAEL',      short:'RAPH',   color:0xd43b2b, css:'#d43b2b', trait:'Sai • Muscle' },
  { name:'MICHELANGELO', short:'MIKEY',  color:0xf07818, css:'#f07818', trait:'Nunchaku • Party' },
  { name:'DONATELLO',    short:'DONNIE', color:0x8e44ad, css:'#8e44ad', trait:'Bo Staff • Brains' },
];

/* ============================================================
   RENDERER / SCENE / POST
============================================================ */
const container = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbcd8ee, 42, 128);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 420);
const CAM_BASE = new THREE.Vector3(0, 4.6, 7.2);
camera.position.copy(CAM_BASE);
camera.lookAt(0, 1.3, -6);

// PBR environment reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.65, 0.55, 0.88);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

const hemi = new THREE.HemisphereLight(0xcfe4ff, 0x4a5a3a, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4);
sun.position.set(-9, 20, -8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 24;   sun.shadow.camera.bottom = -40;
sun.shadow.camera.far = 80;
sun.shadow.bias = -0.0004;
scene.add(sun);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   AUDIO (tiny synth)
============================================================ */
let AC = null;
function audio() { if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(freq, dur, type='sine', vol=0.18, slide=0) {
  try {
    const ctx = audio(); if (ctx.state==='suspended') ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), ctx.currentTime+dur);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+dur);
  } catch(e){}
}
const sfx = {
  pickup(){ tone(880,.09,'sine',.14); setTimeout(()=>tone(1318,.12,'sine',.14),60); },
  jump(){ tone(320,.18,'square',.08,280); },
  roll(){ tone(200,.15,'sawtooth',.06,-80); },
  power(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.14,'triangle',.16),i*70)); },
  crash(){ tone(180,.5,'sawtooth',.25,-140); tone(90,.6,'square',.2,-60); },
  lane(){ tone(500,.06,'sine',.05); },
};

/* ============================================================
   TEXTURE FACTORY
============================================================ */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

/* --- sky dome --- */
const skyDomeTex = canvasTex(1024, 512, (g,w,h) => {
  const grd = g.createLinearGradient(0,0,0,h*.62);
  grd.addColorStop(0,'#2f6fc4'); grd.addColorStop(.5,'#6aa8e4'); grd.addColorStop(1,'#cfe6f7');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
  // warm horizon band
  const grd2 = g.createLinearGradient(0,h*.42,0,h*.62);
  grd2.addColorStop(0,'rgba(255,224,178,0)'); grd2.addColorStop(1,'rgba(255,224,178,.65)');
  g.fillStyle=grd2; g.fillRect(0,h*.42,w,h*.2);
  // sun glow
  const sx=w*.3, sy=h*.34;
  const sg=g.createRadialGradient(sx,sy,4,sx,sy,150);
  sg.addColorStop(0,'rgba(255,252,235,1)'); sg.addColorStop(.12,'rgba(255,244,200,.95)');
  sg.addColorStop(.4,'rgba(255,232,170,.30)'); sg.addColorStop(1,'rgba(255,232,170,0)');
  g.fillStyle=sg; g.beginPath(); g.arc(sx,sy,150,0,7); g.fill();
  // soft clouds
  g.globalAlpha=.4;
  for (let i=0;i<26;i++){
    const cx=Math.random()*w, cy=h*(.12+Math.random()*.3), r=18+Math.random()*46;
    const cg=g.createRadialGradient(cx,cy,2,cx,cy,r);
    cg.addColorStop(0,'rgba(255,255,255,.9)'); cg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=cg; g.beginPath(); g.ellipse(cx,cy,r*1.9,r*.6,0,0,7); g.fill();
  }
  g.globalAlpha=1;
});
const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(200, 32, 16),
  new THREE.MeshBasicMaterial({ map:skyDomeTex, side:THREE.BackSide, fog:false })
);
scene.add(skyDome);

/* --- road --- */
const roadTex = canvasTex(1024, 2048, (g,w,h) => {
  g.fillStyle='#33363d'; g.fillRect(0,0,w,h);
  for (let i=0;i<2600;i++){
    const v=18+Math.random()*38|0;
    g.fillStyle=`rgba(${v},${v},${v+6},.4)`;
    g.fillRect(Math.random()*w, Math.random()*h, 4, 4);
  }
  // tire wear (darker strips in each lane)
  g.fillStyle='rgba(0,0,0,.14)';
  for (const lx of [w/6, w/2, 5*w/6]) { g.fillRect(lx-70,0,52,h); g.fillRect(lx+18,0,52,h); }
  // asphalt patches
  for (let i=0;i<6;i++){ g.fillStyle='rgba(0,0,0,.18)';
    g.fillRect(Math.random()*w*.8, Math.random()*h, 90+Math.random()*140, 60+Math.random()*90); }
  // manhole
  g.save(); g.translate(w/2, h*.24);
  g.fillStyle='#22252a'; g.beginPath(); g.arc(0,0,46,0,7); g.fill();
  g.strokeStyle='#4a4e55'; g.lineWidth=6; g.beginPath(); g.arc(0,0,40,0,7); g.stroke();
  g.beginPath(); g.arc(0,0,22,0,7); g.stroke(); g.restore();
  // crosswalk at tile end
  g.fillStyle='rgba(225,225,225,.85)';
  for (let x=30;x<w-30;x+=110) g.fillRect(x, h-150, 66, 120);
  // lane dashes
  g.fillStyle='#e8d44d';
  for (const x of [w/3, 2*w/3]) for (let y=0;y<h-180;y+=256) g.fillRect(x-9, y, 18, 128);
  // edge lines
  g.fillStyle='#d8d8d8'; g.fillRect(10,0,14,h); g.fillRect(w-24,0,14,h);
});
roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping;
roadTex.repeat.set(1, 7);

/* --- sidewalk --- */
const walkTex = canvasTex(256, 512, (g,w,h) => {
  g.fillStyle='#96979c'; g.fillRect(0,0,w,h);
  g.strokeStyle='#75767b'; g.lineWidth=7;
  for (let y=0;y<=h;y+=128){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  g.beginPath(); g.moveTo(w/2,0); g.lineTo(w/2,h); g.stroke();
  for (let i=0;i<140;i++){ g.fillStyle='rgba(0,0,0,.08)'; g.fillRect(Math.random()*w,Math.random()*h,5,4); }
  // cracks
  g.strokeStyle='rgba(0,0,0,.2)'; g.lineWidth=2;
  for (let i=0;i<5;i++){ g.beginPath(); let x=Math.random()*w,y=Math.random()*h; g.moveTo(x,y);
    for(let k=0;k<4;k++){ x+=rnd(-30,30); y+=rnd(10,40); g.lineTo(x,y);} g.stroke(); }
});
walkTex.wrapS = walkTex.wrapT = THREE.RepeatWrapping;
walkTex.repeat.set(2, 30);

/* --- building facades (generated variety) --- */
const SHOPS = ["TONY'S PIZZA","BODEGA","NINJA DOJO","COMIC KING","BAGELS","RAMEN BAR","ARCADE","LUCKY DELI"];
const AWNING = ['#c0392b','#1f7a4d','#2b6fd4','#b8801f','#7a3608'];
function makeFacadeTex() {
  const base = pick(['#a4553d','#8f6f57','#66748a','#a8894f','#6e5a49','#5d6d5e','#8a4a3a','#7d7f88']);
  const lit = Math.random()<.5;
  return canvasTex(256, 1024, (g,w,h) => {
    g.fillStyle=base; g.fillRect(0,0,w,h);
    // brick courses
    g.strokeStyle='rgba(0,0,0,.10)'; g.lineWidth=2;
    for (let y=0;y<h;y+=14){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
    // grime
    for (let i=0;i<400;i++){ g.fillStyle='rgba(0,0,0,.07)'; g.fillRect(Math.random()*w,Math.random()*h,9,5); }
    const cols=4, rows=14, ww=w/cols, wh=(h-140)/rows;
    for (let cx=0;cx<cols;cx++) for (let cy=0;cy<rows;cy++){
      const x=cx*ww+ww*.2, y=cy*wh+wh*.18, wwd=ww*.6, whd=wh*.62;
      // sill + lintel
      g.fillStyle='rgba(0,0,0,.25)'; g.fillRect(x-4, y+whd, wwd+8, 5);
      g.fillStyle='rgba(255,255,255,.14)'; g.fillRect(x-3, y-4, wwd+6, 4);
      const on = Math.random()<.3;
      const wg = g.createLinearGradient(0,y,0,y+whd);
      if (on){ wg.addColorStop(0,'#ffedb0'); wg.addColorStop(1,'#e8b45e'); }
      else { wg.addColorStop(0,'#33465c'); wg.addColorStop(1,'#1a2634'); }
      g.fillStyle=wg; g.fillRect(x,y,wwd,whd);
      // frame + glass shine
      g.strokeStyle='rgba(0,0,0,.5)'; g.lineWidth=3; g.strokeRect(x,y,wwd,whd);
      g.strokeStyle='rgba(0,0,0,.3)'; g.beginPath(); g.moveTo(x+wwd/2,y); g.lineTo(x+wwd/2,y+whd); g.stroke();
      if (!on){ g.fillStyle='rgba(255,255,255,.10)'; g.beginPath();
        g.moveTo(x,y); g.lineTo(x+wwd*.45,y); g.lineTo(x,y+whd*.6); g.fill(); }
    }
    // fire escape zigzag over windows (some columns)
    if (Math.random()<.55){
      g.strokeStyle='rgba(20,22,26,.85)'; g.lineWidth=4;
      const fx=w*.5;
      for (let cy=0;cy<rows-1;cy++){
        const y0=cy*wh+wh*.15, y1=(cy+1)*wh+wh*.15;
        g.strokeRect(fx-w*.3, y0, w*.6, 6);
        g.beginPath(); g.moveTo(cy%2? fx-w*.28 : fx+w*.28, y0); g.lineTo(cy%2? fx+w*.28 : fx-w*.28, y1); g.stroke();
        for (let b=-3;b<=3;b++){ g.beginPath(); g.moveTo(fx+b*w*.09, y0); g.lineTo(fx+b*w*.09, y0+14); g.stroke(); }
      }
    }
    // ---- storefront (bottom 140px) ----
    g.fillStyle='#2a2e34'; g.fillRect(0,h-140,w,140);
    const glow = g.createLinearGradient(0,h-100,0,h);
    glow.addColorStop(0, lit?'#ffe9b8':'#3d4d63'); glow.addColorStop(1, lit?'#c98d3f':'#232f40');
    g.fillStyle=glow; g.fillRect(10,h-104,w-20,96);
    g.strokeStyle='#15181c'; g.lineWidth=6; g.strokeRect(10,h-104,w-20,96);
    g.strokeStyle='rgba(0,0,0,.5)'; g.beginPath(); g.moveTo(w/2,h-104); g.lineTo(w/2,h-8); g.stroke();
    // awning
    const ac = pick(AWNING);
    g.fillStyle=ac; g.fillRect(0,h-140,w,26);
    g.fillStyle='rgba(255,255,255,.85)';
    for (let x=0;x<w;x+=32) g.fillRect(x,h-140,16,26);

    // sign

    g.fillStyle='#141518'; g.fillRect(20,h-178,w-40,34);

/* --- buildings (group per building: facade box + roof clutter) --- */
const buildings = [];
function buildBuilding(side, zPos) {
  const g = new THREE.Group();
  const w = rnd(6,11), h = rnd(9,24), d = 8;
  const tex = pick(facadeTexes);
  const sideMat = new THREE.MeshStandardMaterial({ map:tex, roughness:.85 });
  const roofMat = new THREE.MeshStandardMaterial({ color:0x4a4e54, roughness:.9 });
  const box = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    [sideMat, sideMat, roofMat, roofMat, sideMat, sideMat]);
  box.position.y = h/2 - .2;
  g.add(box);
  // parapet
  const par = new THREE.Mesh(new THREE.BoxGeometry(w+.3,.4,d+.3), M.neonBack);
  par.position.y = h - .1; g.add(par);
  // AC units
  for (let i=0;i<2;i++){
    const ac = new THREE.Mesh(new THREE.BoxGeometry(rnd(.8,1.4),.6,rnd(.8,1.2)), M.trainDark);
    ac.position.set(rnd(-w/3,w/3), h+.1, rnd(-d/3,d/3)); g.add(ac);
  }
  // water tower
  if (Math.random()<.4){
    const wt = new THREE.Group();
    const tank = new THREE.Mesh(new THREE.CylinderGeometry(.9,1.0,1.7,12), M.plank);
    tank.position.y=1.6; wt.add(tank);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(1.05,.7,12), M.trainDark);
    roof.position.y=2.8; wt.add(roof);
    for (let i=0;i<4;i++){
      const a=i/4*Math.PI*2;
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1.6,6), M.pole);
      leg.position.set(Math.cos(a)*.7,.8,Math.sin(a)*.7); wt.add(leg);
    }
    wt.position.set(rnd(-w/4,w/4), h-.2, rnd(-d/4,d/4));
    g.add(wt);
  }
  // rooftop neon billboard facing the street
  if (Math.random()<.45){
    const bb = new THREE.Group();
    const face = new THREE.Mesh(new THREE.PlaneGeometry(4.6,2.3), new THREE.MeshBasicMaterial({ map:makeNeonTex() }));
    bb.add(face);
    const back = new THREE.Mesh(new THREE.BoxGeometry(4.7,2.4,.18), M.neonBack);
    back.position.z = -.1; bb.add(back);
    for (const px of [-1.7,1.7]){
      const p = new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,1.6,6), M.pole);
      p.position.set(px,-1.85,-.1); bb.add(p);
    }
    bb.position.set(0, h+1.9, side<0 ? d/2-.4 : -d/2+.4);
    bb.rotation.y = side<0 ? Math.PI/2 : -Math.PI/2;
    // face the road: billboard sits on inner edge, rotated toward street
    bb.rotation.y = side<0 ? Math.PI/2 : -Math.PI/2;
    bb.position.set(side<0 ? w/2*0 : 0, h+1.9, 0);
    bb.rotation.y = 0;
    bb.position.x = side<0 ? 0 : 0;
    // simplest: face +z/-z? face toward camera direction (+z)
    bb.rotation.y = side<0 ? .35 : -.35;
    g.add(bb);
  }
  g.position.set(side*(7.7 + w/2), 0, zPos);
  g.userData.side = side;
  scene.add(g);
  buildings.push(g);
  return g;
}

============================================================ */
const burstPool = [];
for (let i=0;i<36;i++){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:sparkTex, transparent:true, opacity:0, depthWrite:false }));
  sp.scale.set(.5,.5,1);
  sp.userData = { life:0, vel:new THREE.Vector3() };
  scene.add(sp); burstPool.push(sp);
}
let burstIdx = 0;
function burst(pos, color=0xffd24d, n=7) {
  for (let i=0;i<n;i++){
    const sp = burstPool[burstIdx++ % burstPool.length];
    sp.position.copy(pos);
    sp.material.color.setHex(color);
    sp.material.opacity = 1;
    sp.userData.life = .45;
    sp.userData.vel.set(rnd(-2.4,2.4), rnd(1.5,4.2), rnd(-1.5,1.5));
  }
}
function updateBursts(dt) {
  for (const sp of burstPool){
    if (sp.userData.life<=0) continue;
    sp.userData.life -= dt;
    sp.position.addScaledVector(sp.userData.vel, dt);
    sp.userData.vel.y -= 7*dt;
    sp.material.opacity = Math.max(0, sp.userData.life/.45);
  }
}

let distSinceRow = 0;

const BUILDERS = { hurdle:makeHurdle, scaffold:makeScaffold, trash:makeTrash, taxi:makeTaxi, train:makeTrain };

function spawnObstacle(name, lane, z) {
  const built = BUILDERS[name]();
  built.mesh.position.set(LANE_X[lane], 0, z);
  scene.add(built.mesh);
  spawned.push({ mesh:built.mesh, kind:'obstacle', type:name, need:built.need,
    lane, box:built.box, speedMul:built.speedMul||1 });
}
function spawnPizzaLine(lane, z, count, arc=false) {
  for (let i=0;i<count;i++){
    const m = makePizza();
    let y = 1.0;
    if (arc) { const t = i/(count-1); y = 1.0 + Math.sin(t*Math.PI)*1.35; }
    m.position.set(LANE_X[lane], y, z - i*2.0);
    scene.add(m);
    spawned.push({ mesh:m, kind:'pizza', lane, speedMul:1 });
  }
}
function spawnPower(lane, z) {
  const type = Math.random()<0.5 ? 'magnet' : 'shield';
  const m = makePowerup(type);
  m.position.set(LANE_X[lane], 1.1, z);
  scene.add(m);
  spawned.push({ mesh:m, kind:'power', type, lane, speedMul:1 });
}
function spawnRow() {
  const lanes = [0,1,2];
  const nBlocked = Math.random() < Math.min(.28 + speed/90, .62) ? 2 : 1;
  const shuffled = lanes.slice().sort(()=>Math.random()-.5);
  const blocked = shuffled.slice(0,nBlocked);
  const open = shuffled.slice(nBlocked);
  const blockedTypes = [];
  for (const l of blocked) {
    const r = Math.random();
    let type;
    if (r<.3) type='hurdle';
    else if (r<.5) type='scaffold';
    else if (r<.68) type='trash';
    else type='taxi';
    blockedTypes.push(type);
    spawnObstacle(type, l, SPAWN_Z);
  }
  const rr = Math.random();
  if (rr < .5) {
    spawnPizzaLine(open[Math.floor(Math.random()*open.length)], SPAWN_Z+1, 5+Math.floor(Math.random()*4));
  } else if (rr < .68) {
    const jumpIdx = blockedTypes.findIndex(t => t==='hurdle'||t==='trash');
    if (jumpIdx>=0) spawnPizzaLine(blocked[jumpIdx], SPAWN_Z+4, 5, true);
    else spawnPizzaLine(open[0], SPAWN_Z+1, 5);
  }
  if (Math.random() < .06) spawnPower(open[Math.floor(Math.random()*open.length)], SPAWN_Z-6);
}
function maybeSpawnTrain(dt) {
  trainCooldown -= dt;
  if (trainCooldown > 0) return;
  if (Math.random() < .1) {
    const lane = Math.floor(Math.random()*3);
    spawnObstacle('train', lane, SPAWN_Z - 60);
    trainCooldown = 7 + Math.random()*6;
  } else trainCooldown = 1.5;
}

/* ============================================================
   GAME STATE
============================================================ */
let state = 'menu';
let speed = BASE_SPEED;
let score = 0, pizzas = 0;
let best = +(localStorage.getItem('tmnt-runner-best')||0);
let bestPizzas = +(localStorage.getItem('tmnt-runner-best-pizza')||0);
let selChar = +(localStorage.getItem('tmnt-runner-char')||2);

let lane = 1, px = 0;
let py = 0, vy = 0, grounded = true;
let rolling = 0;
let invincible = 0;
let magnetT = 0, shieldT = 0;
let runT = 0;
let crashT = 0, camShake = 0, landT = 0;

/* ============================================================
   INPUT
============================================================ */
function doLeft()  { if (state!=='run') return; if (lane>0){ lane--; sfx.lane(); } }
function doRight() { if (state!=='run') return; if (lane<2){ lane++; sfx.lane(); } }
function doJump()  {
  if (state!=='run') return;
  if (grounded) { vy = JUMP_V; grounded=false; rolling=0; sfx.jump(); }
}
function doRoll()  {
  if (state!=='run') return;
  if (!grounded) { vy = -22; }
  rolling = ROLL_TIME; sfx.roll();
}
addEventListener('keydown', e => {
  switch(e.code) {
    case 'ArrowLeft': case 'KeyA': doLeft(); break;
    case 'ArrowRight': case 'KeyD': doRight(); break;
    case 'ArrowUp': case 'KeyW': case 'Space': doJump(); e.preventDefault(); break;
    case 'ArrowDown': case 'KeyS': doRoll(); break;
    case 'KeyP': case 'Escape':
      if (state==='run') pauseGame(); else if (state==='pause') resumeGame();
      break;
  }
});
let tX=0, tY=0, tT=0;
addEventListener('touchstart', e => {
  const t=e.touches[0]; tX=t.clientX; tY=t.clientY; tT=performance.now();
}, {passive:true});
addEventListener('touchend', e => {
  const t=e.changedTouches[0];
  const dx=t.clientX-tX, dy=t.clientY-tY;
  if (performance.now()-tT > 600) return;
  if (Math.abs(dx)<24 && Math.abs(dy)<24) { doJump(); return; }
  if (Math.abs(dx) > Math.abs(dy)) { dx>0 ? doRight() : doLeft(); }
  else { dy<0 ? doJump() : doRoll(); }
}, {passive:true});

/* ============================================================
   UI
============================================================ */
const $ = id => document.getElementById(id);
const ui = {
  menu:$('menu'), hud:$('hud'), over:$('gameover'), paused:$('paused'),
  score:$('scoreTxt'), pizza:$('pizzaTxt'), powerBar:$('powerBar'), toast:$('toast'),
  goScore:$('goScore'), goPizza:$('goPizza'), goBest:$('goBest'), newBest:$('newBest'),
  bestLine:$('bestLine'), chars:$('chars'),
};
CHARACTERS.forEach((c,i) => {
  const card = document.createElement('div');
  card.className='charCard'+(i===selChar?' sel':'');
  card.innerHTML = `<div class="charFace"><div class="charBand" style="background:${c.css}"></div></div>
    <div class="charName">${c.short}</div><div class="charTrait">${c.trait}</div>`;
  card.onclick = () => {
    selChar=i; localStorage.setItem('tmnt-runner-char', i);
    document.querySelectorAll('.charCard').forEach((el,j)=>el.classList.toggle('sel', j===i));
    setCharacter(i);
    tone(400+i*80,.1,'triangle',.1);
  };
  ui.chars.appendChild(card);
});
setCharacter(selChar);
function refreshBestLine(){
  ui.bestLine.textContent = best>0 ? `BEST: ${best}  •  🍕 ${bestPizzas}` : '';
}
refreshBestLine();

let toastTimer=null;
function toast(msg) {
  ui.toast.textContent = msg;
  ui.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>ui.toast.classList.remove('show'), 1200);
}
function renderPowerBar() {
  let html='';
  if (magnetT>0) html += `<div class="power"><span class="ic">🧲</span><div class="track"><div class="fill" style="width:${magnetT/8*100}%"></div></div></div>`;
  if (shieldT>0) html += `<div class="power"><span class="ic">🛡️</span><div class="track"><div class="fill" style="width:${shieldT/12*100}%"></div></div></div>`;
  ui.powerBar.innerHTML = html;
}

/* ============================================================
   GAME FLOW
============================================================ */
function clearSpawned() {
  for (const s of spawned) scene.remove(s.mesh);
  spawned.length = 0;
}
function startGame() {
  clearSpawned();
  state='run';
  speed=BASE_SPEED; score=0; pizzas=0;
  lane=1; px=0; py=0; vy=0; grounded=true; rolling=0;
  invincible=0; magnetT=0; shieldT=0; shieldMesh.visible=false;
  crashT=0; camShake=0; landT=0; distSinceRow=0; nextRowGap=16; trainCooldown=6;
  body.rotation.set(0,0,0); body.position.y=0; player.visible=true;
  player.position.set(0,0,PLAYER_Z);
  ui.menu.classList.add('hidden');
  ui.over.classList.add('hidden');
  ui.paused.classList.add('hidden');
  ui.hud.classList.remove('hidden');
  audio();
  toast('COWABUNGA!');
  sfx.power();
}
function endGame() {
  state='over';
  sfx.crash();
  const sc = Math.floor(score);
  const isBest = sc > best;
  if (isBest) { best = sc; localStorage.setItem('tmnt-runner-best', best); }
  if (pizzas > bestPizzas) { bestPizzas = pizzas; localStorage.setItem('tmnt-runner-best-pizza', bestPizzas); }
  ui.goScore.textContent = `SCORE: ${sc}`;
  ui.goPizza.textContent = `🍕 x ${pizzas}`;
  ui.goBest.textContent = `BEST: ${best}`;
  ui.newBest.classList.toggle('hidden', !isBest);
  setTimeout(()=> {
    ui.hud.classList.add('hidden');
    ui.over.classList.remove('hidden');
  }, 700);
  refreshBestLine();
}
function pauseGame(){ if(state!=='run')return; state='pause'; ui.paused.classList.remove('hidden'); }
function resumeGame(){ if(state!=='pause')return; state='run'; ui.paused.classList.add('hidden'); lastT=performance.now(); }
function toMenu(){
  state='menu'; clearSpawned();
  ui.over.classList.add('hidden'); ui.paused.classList.add('hidden');
  ui.hud.classList.add('hidden'); ui.menu.classList.remove('hidden');
  ui.powerBar.innerHTML='';
  player.visible=true; body.rotation.set(0,0,0);
}
$('startBtn').onclick = startGame;
$('retryBtn').onclick = startGame;
$('menuBtn').onclick = toMenu;
$('quitBtn').onclick = toMenu;
$('resumeBtn').onclick = resumeGame;
$('pauseBtn').onclick = () => state==='run' ? pauseGame() : resumeGame();
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && state==='run') pauseGame(); });

/* ============================================================
   COLLISION
============================================================ */
function playerHeight(){ return rolling>0 ? 0.85 : 1.7; }
function checkCollisions() {
  const pw=.7, pd=.6;
  const ph = playerHeight();
  const pBot = py, pTop = py+ph;
  for (let i=spawned.length-1; i>=0; i--) {
    const s = spawned[i];
    const m = s.mesh;
    if (s.kind==='pizza') {
      const dx = m.position.x - px, dy = m.position.y - (py+1.0), dz = m.position.z - PLAYER_Z;
      const rad = magnetT>0 ? 1.1 : .85;
      if (dx*dx+dy*dy+dz*dz < rad*rad) {
        burst(m.position, 0xffd24d, 7);
        scene.remove(m); spawned.splice(i,1);
        pizzas++; score += 25; sfx.pickup();
      }
      continue;
    }
    if (s.kind==='power') {
      const dx=m.position.x-px, dz=m.position.z-PLAYER_Z;
      if (Math.abs(dx)<.9 && Math.abs(dz)<.9) {
        burst(m.position, s.type==='magnet'?0xff8a70:0x7dffb0, 12);
        scene.remove(m); spawned.splice(i,1);
        if (s.type==='magnet'){ magnetT=8; toast('🧲 PIZZA MAGNET!'); }
        else { shieldT=12; shieldMesh.visible=true; toast('🛡️ SHELL POWER!'); }
        sfx.power();
        bloomPass.strength = 1.4;
      }
      continue;
    }
    const b = s.box;
    const oz = m.position.z;
    if (Math.abs(oz - PLAYER_Z) > (b.d/2 + pd/2)) continue;
    if (Math.abs(m.position.x - px) > (b.w/2 + pw/2)) continue;
    const oBot = b.yBottom, oTop = b.yBottom + b.h;
    if (pBot >= oTop - 0.05) continue;
    if (pTop <= oBot + 0.05) continue;
    if (invincible>0) continue;
    if (shieldT>0) {
      shieldT=0; shieldMesh.visible=false; invincible=1.2;
      toast('SHELL SAVED YOU!');
      burst(new THREE.Vector3(px, py+1, PLAYER_Z), 0x7dffb0, 14);
      tone(240,.3,'square',.15,-100);
      if (s.type!=='train') { scene.remove(m); spawned.splice(i,1); }
      continue;
    }
    crash();
    return;
  }
}
function crash() {
  crashT = 0.001;
  camShake = 1;
  endGame();
}

/* ============================================================
   MAIN LOOP
============================================================ */
let lastT = performance.now();
// drive the loop with rAF normally; fall back to slow setTimeout ticks when the
// tab is hidden so the scene stays warm (gameplay auto-pauses via visibilitychange)
const tick = cb => document.hidden ? setTimeout(()=>cb(performance.now()), 100) : requestAnimationFrame(cb);
function animate(now) {
  tick(animate);
  const dt = Math.min((now - lastT)/1000, 0.05);
  lastT = now;

  // relax bloom back to base
  bloomPass.strength += (0.65 - bloomPass.strength) * Math.min(1, 3*dt);

  if (state==='run') {
    runT += dt;
    speed = Math.min(MAX_SPEED, speed + SPEED_RAMP*dt);
    score += speed * dt * 1.2;

    distSinceRow += speed*dt;
    if (distSinceRow >= nextRowGap) {
      distSinceRow = 0;
      nextRowGap = 14 + Math.random()*10 - Math.min(6, speed*0.12);
      spawnRow();
    }
    maybeSpawnTrain(dt);

    const targetX = LANE_X[lane];
    px += (targetX - px) * Math.min(1, LANE_LERP*dt);

    const wasGrounded = grounded;
    if (!grounded) {
      vy += GRAVITY*dt;
      py += vy*dt;
      if (py<=0){ py=0; vy=0; grounded=true; landT=.18; }
    }
    if (landT>0) landT-=dt;
    if (rolling>0) rolling -= dt;
    if (invincible>0) invincible -= dt;
    if (magnetT>0) magnetT -= dt;
    if (shieldT>0){ shieldT -= dt; if (shieldT<=0) shieldMesh.visible=false; }

    player.position.x = px;
    player.position.y = py;

    // --- turtle animation ---
    const cyc = runT * (8 + speed*0.25);
    if (grounded && rolling<=0) {
      const sw = Math.sin(cyc);
      limbs.armL.up.rotation.x =  sw*1.0;
      limbs.armR.up.rotation.x = -sw*1.0;
      limbs.armL.lo.rotation.x = -.9 - Math.max(0,sw)*.5;
      limbs.armR.lo.rotation.x = -.9 - Math.max(0,-sw)*.5;
      limbs.legL.up.rotation.x = -sw*1.05;
      limbs.legR.up.rotation.x =  sw*1.05;
      limbs.legL.lo.rotation.x = Math.max(0,sw)*1.3;
      limbs.legR.lo.rotation.x = Math.max(0,-sw)*1.3;
      body.position.y = Math.abs(Math.sin(cyc))*.075;
      body.rotation.x = .14;
      body.rotation.z = (targetX-px)*.14;
      // landing squash
      body.scale.y = landT>0 ? .92+.08*(1-landT/.18) : 1;
    } else if (rolling>0) {
      const t = 1 - rolling/ROLL_TIME;
      body.rotation.x = t*Math.PI*2 + .14;
      body.position.y = -0.22;
      body.scale.y = 1;
      limbs.armL.up.rotation.x = limbs.armR.up.rotation.x = 2.3;
      limbs.armL.lo.rotation.x = limbs.armR.lo.rotation.x = -1.6;
      limbs.legL.up.rotation.x = limbs.legR.up.rotation.x = -2.0;
      limbs.legL.lo.rotation.x = limbs.legR.lo.rotation.x = 2.0;
    } else {
      body.rotation.x = .3;
      body.position.y = 0;
      body.scale.y = 1;
      limbs.armL.up.rotation.x = -2.5; limbs.armR.up.rotation.x = -2.3;
      limbs.armL.lo.rotation.x = -.5; limbs.armR.lo.rotation.x = -.6;
      limbs.legL.up.rotation.x = .8;  limbs.legR.up.rotation.x = .3;
      limbs.legL.lo.rotation.x = 1.4; limbs.legR.lo.rotation.x = .9;
      body.rotation.z = 0;
    }
    if (rolling<=0 && Math.abs(body.rotation.x)>1.2) body.rotation.x=.14;
    limbs.tails[0].rotation.x = .25+Math.sin(runT*9)*.35;
    limbs.tails[1].rotation.x = .2+Math.sin(runT*9+1.3)*.35;
    limbs.head.rotation.x = -body.rotation.x*.5;

    player.visible = invincible>0 ? (Math.floor(now/80)%2===0) : true;
    shieldMesh.material.opacity = .16 + Math.sin(now/180)*.06;

    // --- move world ---
    roadTex.offset.y += speed*dt/37.14;   // 260/7 repeats
    walkTex.offset.y += speed*dt/8.66;

    for (const b of buildings) {
      b.position.z += speed*dt;
      if (b.position.z > 24) b.position.z -= 156;
    }
    for (const p of props) {
      p.position.z += speed*dt;
      if (p.position.z > 20) p.position.z -= 228;
    }
    // steam animation
    for (const v of steamVents) {
      for (const sp of v.puffs) {
        let t = ((now/1000)*.5 + sp.userData.phase) % 1;
        sp.position.y = .3 + t*2.2;
        const s = .7 + t*1.8;
        sp.scale.set(s,s,1);
        sp.material.opacity = .38 * (1-t);
      }
    }

    for (let i=spawned.length-1;i>=0;i--) {
      const s = spawned[i];
      s.mesh.position.z += speed * dt * (s.speedMul||1);
      if (s.kind==='pizza') {
        s.mesh.rotation.y += dt*4;
        if (magnetT>0) {
          const d = s.mesh.position.distanceTo(new THREE.Vector3(px, py+1, PLAYER_Z));
          if (d < 5.5) s.mesh.position.lerp(new THREE.Vector3(px, py+1, PLAYER_Z), Math.min(1, 10*dt));
        }
      }
      if (s.kind==='power') { s.mesh.rotation.y += dt*3; s.mesh.position.y = 1.1 + Math.sin(now/300)*.12; }
      if (s.kind==='obstacle' && s.mesh.userData.beacon) {
        s.mesh.userData.beacon.material.emissiveIntensity = (Math.floor(now/350)%2) ? 2.4 : .3;
      }
      if (s.mesh.position.z > KILL_Z) { scene.remove(s.mesh); spawned.splice(i,1); }
    }

    checkCollisions();
    updateBursts(dt);

    ui.score.textContent = Math.floor(score);
    ui.pizza.textContent = `🍕 ${pizzas}`;
    renderPowerBar();

    // speed FOV kick
    const targetFov = 58 + (speed-BASE_SPEED)*0.55;
    camera.fov += (targetFov - camera.fov)*Math.min(1,3*dt);
    camera.updateProjectionMatrix();
  }

  if (state==='over' && crashT < 1.2) {
    crashT += dt;
    body.rotation.x += dt*5;
    player.position.z += dt*6;
    player.position.y = Math.max(0, player.position.y - dt*2);
    updateBursts(dt);
  }

  // camera
  let cx = px*0.55, cy = CAM_BASE.y, cz = CAM_BASE.z;
  if (camShake>0) {
    camShake = Math.max(0, camShake - dt*2.2);
    cx += (Math.random()-.5)*camShake*.7;
    cy += (Math.random()-.5)*camShake*.7;
  }
  camera.position.x += (cx-camera.position.x)*Math.min(1,10*dt);
  camera.position.y = cy + py*0.25;
  camera.position.z = cz;
  camera.lookAt(px*0.6, 1.3+py*0.3, -6);
  camera.rotation.z += (LANE_X[lane]-px)*0.012;

  // menu idle showcase
  if (state==='menu') {
    player.position.set(0,0,PLAYER_Z);
    player.rotation.y = Math.PI + Math.sin(now/1600)*.55;
    body.rotation.x = 0; body.position.y = Math.sin(now/500)*.05; body.scale.y=1;
    limbs.armL.up.rotation.x = Math.sin(now/500)*.3;
    limbs.armR.up.rotation.x = -Math.sin(now/500)*.3;
    limbs.armL.lo.rotation.x = limbs.armR.lo.rotation.x = -.4;
    limbs.legL.up.rotation.x = limbs.legR.up.rotation.x = 0;
    limbs.legL.lo.rotation.x = limbs.legR.lo.rotation.x = 0;
    for (const v of steamVents) for (const sp of v.puffs) {
      let t = ((now/1000)*.5 + sp.userData.phase) % 1;
      sp.position.y = .3 + t*2.2;
      const s = .7 + t*1.8;
      sp.scale.set(s,s,1);
      sp.material.opacity = .38 * (1-t);
    }
  } else {
    player.rotation.y = Math.PI;
  }

  composer.render();
}
tick(t => { lastT=t; animate(t); });
</script>
</body>
